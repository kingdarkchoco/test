<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alien Ship Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Load background image
    const bg = new Image();
    bg.src = "assets/background.jpg";  // Ensure this path is correct

    // Load ship image
    const shipImg = new Image();
    shipImg.src = "assets/ship.png";  // Ensure this path is correct

    let ship = {
      x: canvas.width / 2 - 25,
      y: canvas.height - 100,
      width: 50,
      height: 50
    };

    function draw() {
      if (bg.complete) {
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);  // Draw background image
      } else {
        // Fallback to starry sky if background image isn't loaded
        drawStarrySky();
      }

      // Draw ship image (use shipImg instead of the rectangle)
      if (shipImg.complete) {
        ctx.drawImage(shipImg, ship.x, ship.y, ship.width, ship.height);  // Draw the ship
      } else {
        // If the ship image hasn't loaded, draw a fallback rectangle
        ctx.fillStyle = "lime";
        ctx.fillRect(ship.x, ship.y, ship.width, ship.height);
      }

      requestAnimationFrame(draw);
    }

    // Draw a starry sky
    function drawStarrySky() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);  // Black background

      // Draw random white dots as stars
      ctx.fillStyle = "white";
      const starCount = 100;  // Number of stars
      for (let i = 0; i < starCount; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const size = Math.random() * 2 + 1;  // Random size for each star
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);  // Draw each star as a small circle
        ctx.fill();
      }
    }

    bg.onload = () => {
      draw();
    };

    bg.onerror = () => {
      console.error("Error loading background image");
      draw();  // Draw with fallback if image fails
    };

    shipImg.onload = () => {
      draw();
    };

    shipImg.onerror = () => {
      console.error("Error loading ship image");
    };
  </script>
</body>
</html>
