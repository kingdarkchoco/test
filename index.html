<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alien Ship Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Load background image
    const bg = new Image();
    bg.src = "assets/background.jpg";  // Ensure this path is correct

    // Load ship image
    const shipImg = new Image();
    shipImg.src = "assets/ship.png";  // Ensure this path is correct

    let ship = {
      x: canvas.width / 2 - 25,
      y: canvas.height - 100,
      width: 50,
      height: 50
    };

    function draw() {
      if (bg.complete) {
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);  // Draw background image
      } else {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);  // Fallback if image isn't loaded
      }

      // Draw ship image (use shipImg instead of the rectangle)
      if (shipImg.complete) {
        ctx.drawImage(shipImg, ship.x, ship.y, ship.width, ship.height);  // Draw the ship
      } else {
        // If the ship image hasn't loaded, draw a fallback rectangle
        ctx.fillStyle = "lime";
        ctx.fillRect(ship.x, ship.y, ship.width, ship.height);
      }

      requestAnimationFrame(draw);
    }

    bg.onload = () => {
      draw();
    };

    bg.onerror = () => {
      console.error("Error loading background image");
    };

    shipImg.onload = () => {
      draw();
    };

    shipImg.onerror = () => {
      console.error("Error loading ship image");
    };
  </script>
</body>
</html>
